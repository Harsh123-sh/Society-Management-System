<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/nexora-favicon.png" />
    <link rel="apple-touch-icon" href="/nexora-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14B8A6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora | Smart Society Management Platform</title>
    <script>
      (function () {
        try {
          var storageKey = 'society_theme_engine_v2';
          var raw = localStorage.getItem(storageKey);
          var preferences = raw ? JSON.parse(raw) : {};
          var themeMode = preferences.themeMode === 'dark' || preferences.theme === 'dark' ? 'dark' : 'light';
          var theme = themeMode;
          var density = preferences.density || 'comfortable';
          var layout = preferences.layoutMode || preferences.layout || 'glass';
          var accent = preferences.accentColor || preferences.accent || '79 70 229';
          var primary = preferences.primaryColor || '#4f46e5';
          var secondary = preferences.secondaryColor || '#2563eb';
          var isDark = theme === 'dark';
          var tokens = isDark
            ? {
                appBg: '#020617',
                pageBg: '#020617',
                surface: '#0f172a',
                surfaceSoft: '#1e293b',
                cardBg: '#111827',
                heroBg: 'linear-gradient(135deg, #020617, #0f766e)',
                sidebarBg: '#020617',
                navbarBg: '#0f172a',
                textMain: '#f8fafc',
                textSecondary: '#cbd5e1',
                textMuted: '#94a3b8',
                border: '#334155',
                inputBg: '#1e293b',
                inputText: '#f8fafc',
                modalBg: '#0f172a',
                tableBg: '#0f172a',
                tableHeaderBg: '#1e293b',
                buttonPrimaryBg: '#6366f1',
                buttonPrimaryText: '#ffffff',
                shadow: '0 12px 30px rgba(0, 0, 0, 0.35)'
              }
            : {
                appBg: '#f8fafc',
                pageBg: '#f8fafc',
                surface: '#ffffff',
                surfaceSoft: '#f1f5f9',
                cardBg: '#ffffff',
                heroBg: 'linear-gradient(135deg, #ffffff, #f1f5f9)',
                sidebarBg: '#f8fafc',
                navbarBg: '#ffffff',
                textMain: '#0f172a',
                textSecondary: '#334155',
                textMuted: '#64748b',
                border: '#e2e8f0',
                inputBg: '#ffffff',
                inputText: '#0f172a',
                modalBg: '#ffffff',
                tableBg: '#ffffff',
                tableHeaderBg: '#f1f5f9',
                buttonPrimaryBg: '#4f46e5',
                buttonPrimaryText: '#ffffff',
                shadow: '0 12px 30px rgba(15, 23, 42, 0.08)'
              };
          var bg = isDark ? '2 6 23' : '248 250 252';
          var surface = isDark ? '15 23 42' : '255 255 255';
          var surfaceMuted = isDark ? '30 41 59' : '241 245 249';
          var border = isDark ? '51 65 85' : '226 232 240';
          var text = isDark ? '248 250 252' : '15 23 42';
          var textMuted = isDark ? '148 163 184' : '100 116 139';

          Object.keys(tokens).forEach(function (key) {
            var cssName = key.replace(/[A-Z]/g, function (match) { return '-' + match.toLowerCase(); });
            document.documentElement.style.setProperty('--' + cssName, tokens[key]);
          });

          document.documentElement.style.setProperty('--app-accent-rgb', accent);
          document.documentElement.style.setProperty('--app-primary-rgb', primary === '#4f46e5' ? '79 70 229' : accent);
          document.documentElement.style.setProperty('--app-secondary-rgb', secondary === '#2563eb' ? '37 99 235' : accent);
          document.documentElement.style.setProperty('--app-bg-rgb', bg);
          document.documentElement.style.setProperty('--app-surface-rgb', surface);
          document.documentElement.style.setProperty('--app-surface-muted-rgb', surfaceMuted);
          document.documentElement.style.setProperty('--app-border-rgb', border);
          document.documentElement.style.setProperty('--app-text-rgb', text);
          document.documentElement.style.setProperty('--app-text-muted-rgb', textMuted);
          document.documentElement.style.setProperty('--app-card-rgb', surface);
          document.documentElement.style.setProperty('--bg-primary', tokens.pageBg);
          document.documentElement.style.setProperty('--bg-secondary', tokens.surface);
          document.documentElement.style.setProperty('--bg-card', tokens.cardBg);
          document.documentElement.style.setProperty('--bg-main', tokens.appBg);
          document.documentElement.style.setProperty('--bg-sidebar', tokens.sidebarBg);
          document.documentElement.style.setProperty('--bg-header', tokens.navbarBg);
          document.documentElement.style.setProperty('--text-primary', tokens.textMain);
          document.documentElement.style.setProperty('--text-secondary', tokens.textSecondary);
          document.documentElement.style.setProperty('--text-muted', tokens.textMuted);
          document.documentElement.style.setProperty('--text', tokens.textMain);
          document.documentElement.style.setProperty('--border-color', tokens.border);
          document.documentElement.style.setProperty('--input-border', tokens.border);
          document.documentElement.style.setProperty('--input-placeholder', tokens.textMuted);
          document.documentElement.style.setProperty('--button-bg', tokens.buttonPrimaryBg);
          document.documentElement.style.setProperty('--button-text', tokens.buttonPrimaryText);
          document.documentElement.style.setProperty('--table-row-bg', tokens.tableBg);
          document.documentElement.style.setProperty('--shadow-color', isDark ? 'rgba(0, 0, 0, 0.45)' : 'rgba(15, 23, 42, 0.10)');
          document.documentElement.style.setProperty('--background', tokens.appBg);
          document.documentElement.style.setProperty('--card', tokens.cardBg);
          document.documentElement.style.setProperty('--app-font-sans', 'Manrope, Space Grotesk, Segoe UI, sans-serif');
          document.documentElement.style.setProperty('--app-layout-mode', layout);
          document.documentElement.style.setProperty('--app-logo-url', preferences.logoUrl || '/nexora-logo.png');
          document.documentElement.style.setProperty('--app-radius', '24px');
          document.documentElement.style.setProperty('--brand-rgb', accent);
          document.documentElement.style.setProperty('--hero-start', primary);
          document.documentElement.style.setProperty('--hero-end', secondary);
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeMode = themeMode;
          document.documentElement.dataset.density = density;
          document.documentElement.dataset.layout = layout;
          document.documentElement.style.colorScheme = theme;

          if (document.body) {
            document.body.dataset.theme = theme;
            document.body.dataset.themeMode = themeMode;
            document.body.dataset.density = density;
            document.body.dataset.layout = layout;
          }
        } catch (error) {
          // Best effort only.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
